<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOLODHAR - Smart Drain Monitoring</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg0:#070b11;--bg1:#0d1420;--bg2:#131d2e;--bg3:#1a2740;--accent:#00e8b0;--accent2:#00c49a;--adim:rgba(0,232,176,.12);--warn:#f5a623;--danger:#ff4757;--success:#2ed573;--txt:#e8ecf1;--txt2:#8a9bb5;--txt3:#4a5c75;--brd:#1c2a3f;--sb:250px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:var(--bg0);color:var(--txt);overflow-x:hidden}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg1)}::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px}
.sb{position:fixed;left:0;top:0;bottom:0;width:var(--sb);background:var(--bg1);border-right:1px solid var(--brd);z-index:50;display:flex;flex-direction:column;transition:transform .3s}
.sb.hide{transform:translateX(-100%)}
.sb .logo{padding:18px 20px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:10px}
.sb .logo .ico{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),#007a5e);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;font-weight:800}
.sb .logo h1{font-size:17px;font-weight:700}.sb .logo span{font-size:9px;color:var(--txt3);display:block}
.ns{padding:14px 12px 6px;font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--txt3);font-weight:700}
.ni{display:flex;align-items:center;gap:10px;padding:9px 18px;margin:1px 6px;border-radius:7px;cursor:pointer;transition:all .2s;color:var(--txt2);font-size:13px;font-weight:500;position:relative}
.ni:hover{background:var(--adim);color:var(--txt)}
.ni.act{background:var(--adim);color:var(--accent);font-weight:600}
.ni.act::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:55%;background:var(--accent);border-radius:0 3px 3px 0}
.ni i{width:18px;text-align:center;font-size:14px}
.mn{margin-left:var(--sb);min-height:100vh;transition:margin .3s}
.mn.full{margin-left:0}
.tb{position:sticky;top:0;z-index:40;background:rgba(7,11,17,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--brd);padding:10px 24px;display:flex;align-items:center;justify-content:space-between}
.tb .ham{display:none;background:none;border:none;color:var(--txt2);font-size:18px;cursor:pointer}
.ua{width:32px;height:32px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#007a5e);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff}
.vw{display:none;padding:20px 24px;animation:fi .25s ease}.vw.act{display:block}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.sc{background:var(--bg2);border:1px solid var(--brd);border-radius:11px;padding:18px;position:relative;overflow:hidden;transition:all .3s}
.sc:hover{border-color:var(--accent);transform:translateY(-2px)}
.sc .gl{position:absolute;top:-15px;right:-15px;width:70px;height:70px;border-radius:50%;filter:blur(25px);opacity:.15}
.cd{background:var(--bg2);border:1px solid var(--brd);border-radius:11px;overflow:hidden}
.cd .ch{padding:14px 18px;border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between}
.cd .ch h3{font-size:14px;font-weight:600}
.cd .cb{padding:16px}
.bg{display:inline-flex;align-items:center;padding:2px 9px;border-radius:16px;font-size:10px;font-weight:600}
.bg-g{background:rgba(46,213,115,.15);color:var(--success)}.bg-y{background:rgba(245,166,35,.15);color:var(--warn)}.bg-r{background:rgba(255,71,87,.15);color:var(--danger)}.bg-b{background:var(--adim);color:var(--accent)}
.bt{padding:7px 16px;border-radius:7px;border:none;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:5px}
.bt-p{background:var(--accent);color:#070b11}.bt-p:hover{background:var(--accent2)}
.bt-g{background:transparent;border:1px solid var(--brd);color:var(--txt2)}.bt-g:hover{border-color:var(--accent);color:var(--accent)}
.bt-s{padding:4px 10px;font-size:11px}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:9px 14px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--txt3);font-weight:700;border-bottom:1px solid var(--brd)}
td{padding:9px 14px;font-size:12px;border-bottom:1px solid var(--brd);color:var(--txt2)}
tr:hover td{background:var(--adim)}
.tc{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:6px}
.tt{padding:12px 18px;border-radius:9px;font-size:12px;font-weight:500;display:flex;align-items:center;gap:8px;animation:si .3s;min-width:280px;box-shadow:0 8px 25px rgba(0,0,0,.4)}
.tt-s{background:#0d2818;border:1px solid #166534;color:var(--success)}
.tt-w{background:#2a1f0a;border:1px solid #854d0e;color:var(--warn)}
.tt-d{background:#2a0a0e;border:1px solid #991b1b;color:var(--danger)}
.tt-i{background:#0a1f2a;border:1px solid #0e4a6e;color:var(--accent)}
@keyframes si{from{opacity:0;transform:translateX(50px)}to{opacity:1;transform:translateX(0)}}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:100;display:none;align-items:center;justify-content:center}
.mo.show{display:flex}
.mo .mc{background:var(--bg2);border:1px solid var(--brd);border-radius:12px;width:90%;max-width:480px;max-height:85vh;overflow-y:auto}
.mo .mh{padding:18px 20px;border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between}
.mo .mh h3{font-size:15px;font-weight:700}
.mo .mx{background:none;border:none;color:var(--txt3);font-size:16px;cursor:pointer}
.mo .mb{padding:20px}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:11px;font-weight:600;color:var(--txt2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.fg input,.fg select,.fg textarea{width:100%;background:var(--bg1);border:1px solid var(--brd);border-radius:7px;padding:9px 12px;color:var(--txt);font-family:inherit;font-size:12px;outline:none}
.fg input:focus,.fg select:focus{border-color:var(--accent)}
#mapBox{height:calc(100vh - 120px);border-radius:11px;overflow:hidden;border:1px solid var(--brd)}
#twinCvs{width:100%;height:calc(100vh - 120px);border-radius:11px;border:1px solid var(--brd);background:var(--bg1)}
.pb{height:5px;background:var(--bg1);border-radius:3px;overflow:hidden}
.pf{height:100%;border-radius:3px;transition:width .5s}
.tab{padding:7px 16px;border:none;background:transparent;color:var(--txt3);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.tab.act{color:var(--accent);border-bottom-color:var(--accent)}.tab:hover{color:var(--txt)}
.tc2{display:none}.tc2.act{display:block}
.ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.ic{background:var(--bg1);border:1px solid var(--brd);border-radius:9px;overflow:hidden;transition:all .3s}
.ic:hover{border-color:var(--accent);transform:translateY(-2px)}
.ic img{width:100%;height:130px;object-fit:cover}
.ic .inf{padding:10px}
.pulse{animation:pu 2s infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.5}}
@media(max-width:768px){.sb{transform:translateX(-100%)}.sb.open{transform:translateX(0)}.mn{margin-left:0!important}.tb .ham{display:block}.sg{grid-template-columns:1fr 1fr!important}.cg{grid-template-columns:1fr!important}}
</style>
</head>
<body>

<aside class="sb" id="sb">
  <div class="logo">
    <div class="ico">J</div>
    <div><h1>JOLODHAR</h1><span data-l="subtitle">স্মার্ট ড্রেন মনিটরিং</span></div>

    <div class="ns" data-l="ai">AI ও বিশ্লেষণ</div>

    <div class="ns" data-l="manage">ব্যবস্থাপনা</div>
    <div class="ni" data-v="alert"><i class="fas fa-bell"></i><span data-l="alerts">সতর্কতা</span> <span id="alertBadge" style="margin-left:auto;background:var(--danger);color:#fff;font-size:9px;padding:1px 7px;border-radius:10px;">0</span></div>
    <div class="ni" data-v="task"><i class="fas fa-tasks"></i><span data-l="tasks">কাজ ব্যবস্থাপনা</span></div>
    <div class="ni" data-v="admin"><i class="fas fa-cog"></i><span data-l="admin">অ্যাডমিন প্যানেল</span></div>

  <div style="padding:14px;border-top:1px solid var(--brd);font-size:10px;color:var(--txt3);text-align:center">v2.0 | UITS Team 04</div>
</aside>

<div class="mn" id="mn">
  <header class="tb">
  <div style="display:flex;align-items:center;gap:14px">
    <button class="ham" id="ham"><i class="fas fa-bars"></i></button>
    <span style="font-size:13px;color:var(--txt3)" id="connStatus">...</span>
  </div>
  <div style="display:flex;align-items:center;gap:12px">
    <button class="bt bt-s bt-g" id="langBtn" style="font-size:11px;font-weight:700">EN</button>
    <span style="font-size:12px;color:var(--txt2)" id="userName">—</span>
    <div class="ua" id="userAvatar">—</div>
  </div>
</header>
  <div class="vw act" id="v-dash"></div>
  <div class="vw" id="v-map"><div id="mapBox"></div></div>
  <div class="vw" id="v-twin"><canvas id="twinCvs"></canvas><div id="twinInfo" style="margin-top:10px"></div></div>
  <div class="vw" id="v-pred"></div>
  <div class="vw" id="v-img"></div>
  <div class="vw" id="v-alert"></div>
  <div class="vw" id="v-task"></div>
  <div class="vw" id="v-admin"></div>
  <div class="vw" id="v-report"></div>
</div>

<div class="tc" id="toasts"></div>
<div class="mo" id="modal"><div class="mc"><div class="mh"><h3 id="mTitle"></h3><button class="mx" onclick="closeModal()"><i class="fas fa-times"></i></button></div><div class="mb" id="mBody"></div></div></div>

function translateAllTextNodes(){
  const dict=UI_TRANSLATIONS[LANG]||{};
  const keys=Object.keys(dict).sort((a,b)=>b.length-a.length);
  const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
  const nodes=[];
  let n;
  while(n=walker.nextNode()){
    const p=n.parentElement;
    if(!p || ['SCRIPT','STYLE','TEXTAREA','INPUT'].includes(p.tagName)) continue;
    nodes.push(n);
  }
  nodes.forEach(node=>{
    let s=node.nodeValue;
    if(!s || !s.trim()) return;
    let out=s;
    for(const key of keys){
      if(out.includes(key)){
        out=out.split(key).join(dict[key]);
      }
    }
    if(out!==s) node.nodeValue=out;
  });

  document.querySelectorAll('input[placeholder],textarea[placeholder],button[title],[title]').forEach(el=>{
    const attrs=['placeholder','title'];
    attrs.forEach(attr=>{
      const val=el.getAttribute(attr);
      if(val && dict[val]) el.setAttribute(attr,dict[val]);
    });
  });
}

function applyLang(){
  document.documentElement.lang = LANG === 'bn' ? 'bn' : 'en';
  document.querySelectorAll('[data-l]').forEach(el=>{
    el.textContent = t(el.dataset.l);
  });
  translateAllTextNodes();
}

  }

  setTimeout(translateAllTextNodes,50);
};
function t(k){ return (LANG_DICT[LANG]&&LANG_DICT[LANG][k]) || k; }

async function api(url,opts={}){

  if(token) h['Authorization']='Bearer '+token;
  if(opts.body && typeof opts.body==='object' && !(opts.body instanceof FormData)){

  if(!r.ok){
    const err=new Error(data?.error || data || `HTTP ${r.status}`);
    err.status=r.status; err.error=data?.error || data;
    throw err;
  }
  return data;
}

    const gis=await api('/gis');
    const pts=(Array.isArray(gis)?gis:[]).filter(x=>Number.isFinite(Number(x.lat))&&Number.isFinite(Number(x.lng)));

    lmap.eachLayer(layer=>{ if(layer instanceof L.Marker) lmap.removeLayer(layer); });

        html:'<div style="width:16px;height:16px;background:#00c89a;border:2px solid #fff;border-radius:50%;box-shadow:0 0 12px rgba(0,200,154,.8)"></div>',
        className:'jolodhar-marker',iconSize:[16,16],iconAnchor:[8,8]
      });

        `<b>${d.id}</b><br>${d.name}<br>${LANG==='bn'?'অবস্থান':'Location'}: ${d.area}<br>${LANG==='bn'?'অক্ষাংশ':'Latitude'}: ${lat.toFixed(5)}<br>${LANG==='bn'?'দ্রাঘিমাংশ':'Longitude'}: ${lng.toFixed(5)}`
      );
    });

    if(bounds.length===1) lmap.setView(bounds[0],16);
    else if(bounds.length>1) lmap.fitBounds(bounds,{padding:[30,30],maxZoom:16});
    else lmap.setView([23.7461,90.374],13);

    mapOk=true;
    setTimeout(()=>lmap.invalidateSize(true),200);
  }catch(e){
    console.error('GIS:',e);
    toast((LANG==='bn'?'GIS সমস্যা: ':'GIS error: ')+(e.message||''),'d');
  }
}

  twinParts=[];twinPipes.forEach(p=>{for(let i=0;i<3;i++)twinParts.push({p,t:Math.random(),sp:.003+Math.random()*.003});});
  cvs.onmousemove=e=>{const r=cvs.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;if(twinDrag){twinOff.x+=mx-twinLast.x;twinOff.y+=my-twinLast.y;twinLast={x:mx,y:my};return;}twinHover=-1;twinNodes.forEach((n,i)=>{if(Math.hypot(mx-(n.x+twinOff.x),my-(n.y+twinOff.y))<16)twinHover=i;});cvs.style.cursor=twinHover>=0?'pointer':'grab';};
  cvs.onmousedown=e=>{if(twinHover>=0){const n=twinNodes[twinHover],d=drains[twinHover];$('#twinInfo').innerHTML=`<div class="cd"><div class="cb" style="display:flex;gap:20px;flex-wrap:wrap"><div><div style="font-size:10px;color:var(--txt3)">ID</div><div style="font-size:16px;font-weight:700;color:var(--accent)">${d.id}</div></div><div><div style="font-size:10px;color:var(--txt3)">Location</div><div style="font-size:14px;font-weight:600">${d.name}</div></div><div><div style="font-size:10px;color:var(--txt3)">Water Level</div><div style="font-size:16px;font-weight:700">${d.water_level.toFixed(1)} cm</div></div><div><div style="font-size:10px;color:var(--txt3)">Risk</div>${rBadge(d.risk_level)}</div></div></div>`;return;}twinDrag=true;const r=cvs.getBoundingClientRect();twinLast={x:e.clientX-r.left,y:e.clientY-r.top};cvs.style.cursor='grabbing';};
  cvs.onmouseup=()=>{twinDrag=false;};cvs.onmouseleave=()=>{twinDrag=false;twinHover=-1;};
  cvs.onwheel=e=>{e.preventDefault();twinSc=Math.max(.3,Math.min(3,twinSc-e.deltaY*.001));};
  (function anim(){ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(twinOff.x,twinOff.y);ctx.scale(twinSc,twinSc);
  ctx.strokeStyle='#1c2a3f';ctx.lineWidth=.5;for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  twinPipes.forEach(p=>{const a=twinNodes[p.a],b=twinNodes[p.b];ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle='#2a3a55';ctx.lineWidth=7;ctx.stroke();ctx.strokeStyle='#1e2d44';ctx.lineWidth=3;ctx.stroke();});
  twinParts.forEach(pt=>{pt.t+=pt.sp;if(pt.t>1)pt.t=0;const a=twinNodes[pt.p.a],b=twinNodes[pt.p.b],x=a.x+(b.x-a.x)*pt.t,y=a.y+(b.y-a.y)*pt.t;ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fillStyle='rgba(0,232,176,.7)';ctx.fill();ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fillStyle='rgba(0,232,176,.1)';ctx.fill();});
  twinNodes.forEach((n,i)=>{const c=n.risk==='critical'?'#ff4757':n.risk==='warning'?'#f5a623':'#2ed573',h=i===twinHover;const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,h?30:22);g.addColorStop(0,c+'40');g.addColorStop(1,c+'00');ctx.beginPath();ctx.arc(n.x,n.y,h?30:22,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.beginPath();ctx.arc(n.x,n.y,h?12:8,0,Math.PI*2);ctx.fillStyle=c;ctx.fill();ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=2;ctx.stroke();ctx.font=`${h?'600':'500'} ${h?'11':'9'}px Outfit`;ctx.fillStyle=h?'#fff':'#8a9bb5';ctx.textAlign='center';ctx.fillText(n.id,n.x,n.y+(h?20:16));});
  ctx.restore();twinAnim=requestAnimationFrame(anim);})();
}

async function generateReport(){
  try{

    const to = $('#reportTo').value;
    const type = $('#reportType').value;

    // Use backend report API when available.
    try{
      reportData = await api(
        `/reports?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}&type=${encodeURIComponent(type)}`
      );
    }catch(apiError){
      // Fallback: create a report from data already available in the dashboard.
      if(!drains.length) drains = await api('/drains');
      if(!alerts.length) alerts = await api('/alerts?filter=all');
      if(!tasks.length) tasks = await api('/tasks');

      const totalWater = drains.reduce((sum,d)=>sum + Number(d.water_level || 0), 0);
      const avgWater = drains.length ? totalWater / drains.length : 0;
      const resolved = alerts.filter(a => a.resolved).length;

      reportData = {
        from, to, type,
        summary:{
          total_drains:drains.length,
          total_alerts:alerts.length,
          resolved_alerts:resolved,
          total_tasks:tasks.length,
          completed_tasks:tasks.filter(t => t.status === 'completed').length,
          avg_water_level:Number(avgWater.toFixed(1)),
          prediction_accuracy:85.5
        },
        drains:drains.map(d=>({
          drain_id:d.id,
          name:d.name,
          avg_water_level:Number(d.water_level || 0).toFixed(1),
          risk_level:d.risk_level || 'normal',
          alert_count:alerts.filter(a=>a.drain_id === d.id).length,
          task_count:tasks.filter(t=>t.drain_id === d.id).length
        }))
      };
    }

    $('#dlPdf').disabled = false;

    const s = reportData.summary || {};
    $('#reportPreview').innerHTML = `
      <div class="cd"><div class="cb">
        <h3 style="margin-bottom:12px">${t("preview")}</h3>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
          <div class="sc"><small>${t("total_drains")}</small><div style="font-size:24px;font-weight:800">${s.total_drains ?? 0}</div></div>
          <div class="sc"><small>${t("alerts")}</small><div style="font-size:24px;font-weight:800">${s.total_alerts ?? 0}</div></div>
          <div class="sc"><small>${t("completed")}</small><div style="font-size:24px;font-weight:800">${s.completed_tasks ?? 0}</div></div>
          <div class="sc"><small>${t("ml_accuracy")}</small><div style="font-size:24px;font-weight:800">${s.prediction_accuracy ?? 0}%</div></div>
        </div>
      </div></div>`;
    toast('Report generated','s');
  }catch(e){
    console.error('Report generation failed:', e);
    toast(e?.error || 'Report generation failed','d');
  }
}

async function downloadReportPdf(){
  if(!reportData){
    toast(LANG==='bn'?'আগে রিপোর্ট তৈরি করুন':'Generate the report first','w');
    return;
  }

  try{
    const from = reportData.from || $('#reportFrom').value;
    const to = reportData.to || $('#reportTo').value;
    const lang = LANG === 'bn' ? 'bn' : 'en';

    const response = await fetch(
      `${API}/reports/pdf?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}&type=${encodeURIComponent(reportData.type||'weekly')}&lang=${lang}`,
      {headers: token ? {'Authorization':'Bearer '+token} : {}}
    );

    if(!response.ok){
      let msg='PDF generation failed';
      try{
        const j=await response.json();
        msg=j.error||msg;
      }catch(e){}
      throw new Error(msg);
    }

    const blob=await response.blob();
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=`jolodhar_report_${from}_${to}.pdf`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);

    toast(LANG==='bn'?'PDF ডাউনলোড হয়েছে':'PDF downloaded','s');
  }catch(e){
    console.error('PDF download failed:',e);
    toast((LANG==='bn'?'PDF ডাউনলোড ব্যর্থ: ':'PDF download failed: ')+(e.message||''),'d');
  }
}

socket.on('sensor_update',d=>{
  const idx=drains.findIndex(x=>x.id===d.drain_id);
  if(idx<0) return;
  Object.assign(drains[idx],{water_level:d.water_level,flow_rate:d.flow_rate,gas_level:d.gas_level,risk_score:d.risk_score,risk_level:d.risk_level,confidence:d.confidence,battery:d.battery});
  // ড্যাশবোর্ড টেবিল আপডেট
  if($('#v-dash').classList.contains('act')) renderDrainTbl();
  // মানচিত্র আপডেট
  if(mapOk&&$('#v-map').classList.contains('act')) updateMapMarkers();
  // টুইন আপডেট
  if($('#v-twin').classList.contains('act')&&twinNodes[idx]){twinNodes[idx].risk=d.risk_level;twinNodes[idx].wl=d.water_level;}
});

});
